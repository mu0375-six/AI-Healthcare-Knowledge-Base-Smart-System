name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: 运行测试
        working-directory: backend
        # 测试用 test/resources/application.yml，不依赖 .env、MySQL、Redis、Milvus
        run: mvn -B --no-transfer-progress test

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查与构建
        working-directory: frontend
        # build 脚本里已经先跑 vue-tsc --noEmit
        run: npm run build

  secrets:
    name: 密钥泄露自查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 检查是否误提交 .env 或明文密钥
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 不应进入版本库"; exit 1
          fi
          # 只扫 git 跟踪的文件：本地未入库的 .env 里本来就该有真 key，不算问题
          if git ls-files -z | xargs -0 grep -InE 'sk-[A-Za-z0-9]{24,}'; then
            echo "::error::检测到疑似 API Key 明文"; exit 1
          fi
          echo "未发现明文密钥"
