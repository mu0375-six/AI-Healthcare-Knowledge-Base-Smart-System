<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="心电波形">
  <defs>
    <!-- 底色：沿用主题的 rail / moss-deep -->
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#13231d"/>
      <stop offset="55%" stop-color="#17342b"/>
      <stop offset="100%" stop-color="#1d3f33"/>
    </linearGradient>

    <!-- 波形沿 x 轴渐亮：左侧压字区留白，右侧是视觉重心 -->
    <linearGradient id="trace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c45d3a" stop-opacity="0"/>
      <stop offset="22%" stop-color="#c45d3a" stop-opacity="0.35"/>
      <stop offset="58%" stop-color="#d67c5d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e0b08a" stop-opacity="1"/>
    </linearGradient>

    <!-- 心电纸网格 -->
    <pattern id="fine" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#b8965a" stroke-width="0.5" stroke-opacity="0.10"/>
    </pattern>
    <pattern id="coarse" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#b8965a" stroke-width="1" stroke-opacity="0.16"/>
    </pattern>

    <!-- R 波峰处的柔光 -->
    <radialGradient id="pulse">
      <stop offset="0%" stop-color="#e0b08a" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#e0b08a" stop-opacity="0"/>
    </radialGradient>

    <!-- 左侧压暗，保证白字可读（与 hero-veil 遮罩叠加后更稳） -->
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0e1b16" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#0e1b16" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0e1b16" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="420" fill="url(#ground)"/>
  <rect width="1280" height="420" fill="url(#fine)"/>
  <rect width="1280" height="420" fill="url(#coarse)"/>

  <circle cx="1146" cy="205" r="230" fill="url(#pulse)"/>

  <!-- 基线 -->
  <path d="M0 240H1280" stroke="#b8965a" stroke-width="1" stroke-opacity="0.18"/>

  <!-- 心电波形：四个心动周期铺满整幅，振幅向右递增。
       刻意不留尾部平线 —— 拉平在心电图里意味着心跳停止，不该出现在健康产品首页。 -->
  <path
    d="M0 240 L90 240 Q110 231 130 240 L160 240 L172 246 L186 195 L200 258 L212 240 L250 240 Q285 226 320 240
       L410 240 Q430 227 450 240 L480 240 L492 248 L506 177 L520 265 L532 240 L570 240 Q605 220 640 240
       L730 240 Q750 224 770 240 L800 240 L812 251 L826 159 L840 272 L852 240 L890 240 Q925 215 960 240
       L1050 240 Q1070 219 1090 240 L1120 240 L1132 254 L1146 136 L1160 280 L1172 240 L1205 240 Q1240 206 1280 232"
    fill="none"
    stroke="url(#trace)"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <rect width="1280" height="420" fill="url(#shade)"/>
</svg>
