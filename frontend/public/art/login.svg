<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" width="800" height="1100" role="img" aria-label="监护仪三通道波形">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1d3f33"/>
      <stop offset="45%" stop-color="#17342b"/>
      <stop offset="100%" stop-color="#0f1d18"/>
    </linearGradient>

    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c45d3a" stop-opacity="0.25"/>
      <stop offset="35%" stop-color="#d67c5d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e0b08a" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="ink2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8965a" stop-opacity="0.25"/>
      <stop offset="40%" stop-color="#cbb083" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e0b08a" stop-opacity="0.4"/>
    </linearGradient>

    <pattern id="grid-fine" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#b8965a" stroke-width="0.5" stroke-opacity="0.09"/>
    </pattern>
    <pattern id="grid-coarse" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0H0V100" fill="none" stroke="#b8965a" stroke-width="1" stroke-opacity="0.14"/>
    </pattern>

    <radialGradient id="glow">
      <stop offset="0%" stop-color="#e0b08a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e0b08a" stop-opacity="0"/>
    </radialGradient>

    <!-- 单个脉搏波周期，下面平移复用 -->
    <path id="pleth"
      d="M0 0 C20 0 28 -70 40 -70 C52 -70 58 -40 68 -36 C74 -34 78 -42 84 -40 C92 -37 100 -10 115 0"/>

    <!-- 底部压暗，登录页文字压在这里 -->
    <linearGradient id="foot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a15" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0d1a15" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1100" fill="url(#bg)"/>
  <rect width="800" height="1100" fill="url(#grid-fine)"/>
  <rect width="800" height="1100" fill="url(#grid-coarse)"/>

  <circle cx="500" cy="300" r="300" fill="url(#glow)"/>

  <!-- 通道一：心电 -->
  <path
    d="M60 250 L140 250 Q160 238 180 250 L205 250 L214 258 L224 198 L234 274 L243 250 L275 250 Q300 234 325 250 L400 250
       L420 250 Q440 238 460 250 L485 250 L494 258 L504 190 L514 278 L523 250 L555 250 Q580 232 605 250 L740 250"
    fill="none" stroke="url(#ink)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 通道二：脉搏血氧波，四个周期 -->
  <g fill="none" stroke="url(#ink2)" stroke-width="2.2" stroke-linecap="round">
    <use href="#pleth" x="60"  y="490"/>
    <use href="#pleth" x="235" y="490"/>
    <use href="#pleth" x="410" y="490"/>
    <use href="#pleth" x="585" y="490"/>
  </g>

  <!-- 通道三：呼吸曲线 -->
  <path
    d="M60 700 C145 632 230 632 315 700 C400 768 485 768 570 700 C625 656 685 648 740 668"
    fill="none" stroke="url(#ink2)" stroke-width="2" stroke-linecap="round" stroke-opacity="0.8"/>

  <!-- 三条通道的基准线 -->
  <g stroke="#b8965a" stroke-opacity="0.14" stroke-width="1">
    <path d="M60 250H740"/>
    <path d="M60 490H740"/>
    <path d="M60 700H740"/>
  </g>

  <rect y="620" width="800" height="480" fill="url(#foot)"/>
</svg>
