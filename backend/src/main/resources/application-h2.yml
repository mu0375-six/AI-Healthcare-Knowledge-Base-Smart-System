# 离线兜底 profile：无 MySQL 时使用本地 H2 文件库
#   mvn spring-boot:run -Dspring-boot.run.profiles=h2
# H2 控制台 /h2-console，账号 sa，密码见 H2_PASSWORD（默认 healthkb）。
# 升级后若旧库打不开，删除 backend/data 目录即可重建。
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/healthkb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password: ${H2_PASSWORD:healthkb}
  h2:
    console:
      enabled: true
      path: /h2-console
